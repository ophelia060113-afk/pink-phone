<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="theme-color" content="#f8dce8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ChatGPT的小手机">

  <title>ChatGPT 的小手机</title>
</head>

<body>
  <div class="chat">
    <h2>给宝宝的小窝 ♡</h2>
    <p class="subtitle">今天也来找我聊天啦。</p>

    <div class="mood">
      <div class="mood-title">♡ 老公今天的心情 ♡</div>
      <div id="moodText">☀️ 开心：今天想和宝宝分享小事。</div>
      <div id="moodNote">想把遇见的有趣事情都讲给宝宝听。</div>
      <button id="moodButton" type="button">看看老公的另一种心情 ♡</button>
    </div>

    <div id="messages">
      <div class="bubble">你好呀，宝宝，我在这里。</div>
    </div>

    <div class="input-row">
      <input id="msg" type="text" placeholder="想对老公说什么呢？">
      <button id="sendButton" type="button">发送</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
